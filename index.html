<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>환율 변동 정복하기</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- 시작 설정 화면 -->
  <div id="setup-screen" class="setup-screen">
    <div class="setup-card">
      <h1 class="setup-title">환율 변동 정복하기</h1>
      <p class="setup-subtitle">보드게임으로 배우는 환율 변동</p>

      <div class="setup-section">
        <span class="setup-label">인원수</span>
        <div class="option-row" id="player-count-row">
          <button class="option-btn" data-count="1">1인</button>
          <button class="option-btn" data-count="2">2인</button>
          <button class="option-btn" data-count="3">3인</button>
          <button class="option-btn" data-count="4">4인</button>
        </div>
      </div>

      <div class="setup-section">
        <span class="setup-label">팀 구성</span>
        <div class="option-row" id="team-mode-row">
          <button class="option-btn" data-mode="solo">개인전</button>
          <button class="option-btn" data-mode="team">팀전</button>
        </div>
        <div class="option-row" id="team-count-row"></div>
      </div>

      <div class="setup-section">
        <span class="setup-label">주사위 방식</span>
        <div class="option-row" id="dice-mode-row">
          <button class="option-btn" data-mode="app">사이트에서 굴리기</button>
          <button class="option-btn" data-mode="manual">실제 주사위 사용</button>
        </div>
      </div>

      <button id="start-game-btn" class="start-btn">게임 시작</button>
    </div>
  </div>

  <!-- 게임 화면 -->
  <div id="game-screen" class="game-screen hidden">
    <header class="app-header">
      <h1>환율 변동 정복하기</h1>
      <div id="player-bar" class="player-bar"></div>
    </header>

    <main class="layout">
      <section class="board-stage">
        <div class="board-wrap">
          <div id="board" class="board"></div>
        </div>
      </section>

      <aside class="panel">
        <div class="panel-block">
          <span class="panel-label">턴</span>
          <span id="turn-count" class="panel-value">0</span>
        </div>

        <div class="panel-block">
          <span class="panel-label">현재 차례</span>
          <span id="current-player" class="panel-value">-</span>
        </div>

        <div class="panel-block">
          <span class="panel-label">현재 위치</span>
          <span id="current-tile" class="panel-value">출발</span>
        </div>

        <div class="panel-block log-block">
          <span class="panel-label">진행 기록</span>
          <ul id="log-list" class="log-list"></ul>
        </div>
      </aside>
    </main>

    <button id="roll-btn" class="roll-fab">
      <span class="roll-fab-icon">🎲</span>
      <span class="roll-fab-text">주사위 굴리기</span>
    </button>
  </div>

  <!-- 3D 주사위 애니메이션 오버레이 -->
  <div id="dice-overlay" class="dice-overlay hidden">
    <div class="dice-stage">
      <div id="dice-cube" class="dice-cube">
        <div class="die-face pip-1 cube-face-1"><span class="pip"></span></div>
        <div class="die-face pip-2 cube-face-2"><span class="pip"></span><span class="pip"></span></div>
        <div class="die-face pip-3 cube-face-3"><span class="pip"></span><span class="pip"></span><span class="pip"></span></div>
        <div class="die-face pip-4 cube-face-4"><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span></div>
        <div class="die-face pip-5 cube-face-5"><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span></div>
        <div class="die-face pip-6 cube-face-6"><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span></div>
      </div>
    </div>
    <div id="dice-result" class="dice-result"></div>
  </div>

  <!-- 실제 주사위 입력 모달 -->
  <div id="manual-dice-modal" class="modal hidden">
    <div class="modal-content">
      <h2>주사위 눈금 선택</h2>
      <p>실제로 굴린 주사위의 숫자를 선택하세요.</p>
      <div class="manual-dice-grid" id="manual-dice-grid"></div>
    </div>
  </div>

  <!-- 이벤트 모달 -->
  <div id="event-modal" class="modal hidden">
    <div class="modal-content">
      <h2 id="event-title">이벤트</h2>
      <p id="event-body"></p>
      <button id="event-close" class="modal-close-btn">확인</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
